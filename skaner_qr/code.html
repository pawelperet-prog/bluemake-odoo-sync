<style>

        @keyframes scanline {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .animate-scanline {
            animation: scanline 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

<body class="bg-background text-on-background h-screen flex flex-col overflow-hidden font-body-md text-body-md">

<header class="flex justify-between items-center px-margin-mobile h-touch-target-min w-full bg-surface top-app-bar-container z-50 sticky top-0">

<!-- Main Scanner Canvas -->
<main class="flex-1 relative bg-tertiary overflow-hidden">
<!-- Camera Feed Placeholder -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A point-of-view shot looking through a camera viewfinder in a brightly lit industrial warehouse. The focus is on a heavy-duty steel shelving unit with thick metal rods and crossbeams. Industrial minimalism style, high contrast, sharp details. A small metallic tag with a blurred QR code is attached to one of the steel rods. The overall lighting is harsh, functional warehouse lighting, creating a bright light-mode aesthetic despite the industrial setting. Deep slate and bright white tones dominate." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDWPixnLNPbRaRKXOLCmMRPnTH4Ixchu62T9yFsuT4NwtN0QeN8Ihw5mgRei-5vpOQEyrZYMe8nCEtMrXsRqN_gQixEPvzxe6FN3kKRVNwaG5N5R-JSatqWWzX4hXSjiqyeeeSNal-7PrHHagRL2UOnPHp1FXbs5UiShvvgMoA_ngMAfncdd1iXNc-vu-Y1euBHgsjI08YhaTeOggpOrCJwDiMOEkcUGsYXVtKHIj_WsTlwfrEGv-GHw4ldcqRvWWV2Er7tXz7PSu0');">
</div>
<!-- Semi-transparent overlay to focus on the scanner frame -->
<div class="absolute inset-0 flex flex-col pointer-events-none z-10">
<!-- Top block -->
<div class="flex-1 bg-tertiary/70 backdrop-blur-[2px]"></div>
<!-- Middle row with cutout -->
<div class="flex h-64 md:h-80 w-full">
<!-- Left block -->
<div class="flex-1 bg-tertiary/70 backdrop-blur-[2px]"></div>

<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-surface-container-lowest"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-surface-container-lowest"></div>

</div>
<!-- Right block -->
<div class="flex-1 bg-tertiary/70 backdrop-blur-[2px]"></div>
</div>

<!-- Script to simulate scanning interaction for demonstration -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: Click the center frame to simulate a successful scan
            const scannerFrame = document.querySelector('.relative.w-64');
            const successOverlay = document.getElementById('scan-success');

            if (scannerFrame && successOverlay) {
                // Make the wrapper pointer-events-auto just for this demo
                scannerFrame.parentElement.classList.remove('pointer-events-none');
                scannerFrame.parentElement.classList.add('cursor-pointer');
                
                scannerFrame.parentElement.addEventListener('click', () => {
                    successOverlay.classList.remove('opacity-0');
                    successOverlay.classList.add('opacity-100');
                    // In a real app, you would route to the product card here
                    setTimeout(() => {
                        successOverlay.classList.remove('opacity-100');
                        successOverlay.classList.add('opacity-0');
                    }, 2000);
                });
            }
        });
    </script>
