<!DOCTYPE html>

<html lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Szczegóły Pręta</title>

                        "surface-container-highest": "#e0e3e2",
                        "on-background": "#181c1c",

                        "inverse-surface": "#2d3131",
                        "on-surface-variant": "#434749",
                        "on-tertiary-container": "#929da2",
                        "inverse-on-surface": "#eef1f0",

                        "surface-variant": "#e0e3e2",

                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"

                    "spacing": {

                    "fontFamily": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background antialiased selection:bg-secondary selection:text-on-secondary min-h-screen flex flex-col">
<!-- Header: Suppressed global navigation as this is a transactional sub-page -->
<header class="flex justify-between items-center px-margin-mobile h-touch-target-min w-full bg-surface-container border-b border-outline-variant">
<button aria-label="Go Back" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-DEFAULT active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary truncate px-4">Szczegóły Pręta</h1>
<div class="w-touch-target-min"></div> <!-- Balancer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-margin-mobile flex flex-col md:max-w-3xl md:mx-auto md:w-full gap-stack-lg">
<!-- Product Info Card (Level 1 Elevation) -->
<section class="bg-surface-container-lowest border border-surface-container-highest rounded-lg overflow-hidden">
<div class="bg-surface-container px-4 py-3 border-b border-surface-container-highest flex justify-between items-center">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Product Information</h2>
<div class="flex items-center gap-1 bg-surface-container-lowest px-2 py-1 rounded border border-surface-container-highest">
<span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_4px_rgba(16,185,129,0.5)]"></span>
<span class="font-label-caps text-label-caps text-primary">SYNCED</span>
</div>
</div>
<div class="p-4 flex flex-col gap-stack-md">
<div class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 items-start">
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">SKU</span>
<span class="font-headline-md text-headline-md text-primary bg-surface-container-low px-2 py-1 rounded w-fit border border-surface-container-highest font-mono">S355-FI20</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">LOKACJA</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline">location_on</span>
<span class="font-body-md text-body-md text-primary font-bold">Strefa 5</span>
</div>
<div class="col-span-2 h-px bg-surface-container-high my-1"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant self-center">OBECNY STAN</span>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">15.5</span>
<span class="font-body-md text-body-md text-on-surface-variant">m</span>
</div>
</div>
</div>
</section>
<!-- Cut Form Section (Level 2 Elevation context for action) -->
<section class="flex flex-col gap-stack-md mt-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline">content_cut</span>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Nowy stan po ucięciu</h3>
</div>
<div class="bg-surface-container-lowest border-2 border-primary-container rounded-lg p-6 shadow-[0_4px_0_0_#2D3436] focus-within:shadow-[0_2px_0_0_#2D3436] focus-within:translate-y-[2px] transition-all flex flex-col items-center justify-center gap-stack-lg">
<div class="flex items-center justify-center gap-4 w-full">
<!-- Minus Stepper -->
<button aria-label="Decrease value" class="w-16 h-16 rounded border-2 border-outline flex items-center justify-center text-outline hover:bg-surface-container hover:text-primary hover:border-primary active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" style="font-size: 32px;">remove</span>
</button>
<!-- Numeric Display Input -->
<div class="relative flex items-baseline">
<input class="bg-transparent font-numeric-display text-numeric-display text-primary text-center w-32 border-none focus:ring-0 p-0 appearance-none m-0" step="0.1" style="-moz-appearance: textfield;" type="number" value="15.5"/>
<span class="font-headline-md text-headline-md text-on-surface-variant ml-1">m</span>
</div>
<!-- Plus Stepper -->
<button aria-label="Increase value" class="w-16 h-16 rounded border-2 border-outline flex items-center justify-center text-outline hover:bg-surface-container hover:text-primary hover:border-primary active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" style="font-size: 32px;">add</span>
</button>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-sm mt-2">
                    Wprowadź docelową długość pręta pozostającego na stanie.
                </p>
</div>
</section>
<div class="flex-grow"></div>
<!-- Action Area -->
<section class="mt-8 flex flex-col gap-stack-sm pb-4">
<button class="w-full h-16 bg-[#ff6b00] hover:bg-[#e66000] text-on-error font-headline-md text-headline-md rounded flex items-center justify-center gap-2 shadow-[0_4px_0_0_#b34b00] active:translate-y-[4px] active:shadow-none transition-all duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                ZATWIERDŹ ZMIANĘ
            </button>
<p class="font-label-caps text-label-caps text-outline text-center mt-2 flex items-center justify-center gap-1">
<span class="material-symbols-outlined" style="font-size: 14px;">info</span>
                Operacja utworzy korektę stock.quant w Odoo
            </p>
</section>
</main>
<style>
        /* Hide arrows for number inputs */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</body></html>
